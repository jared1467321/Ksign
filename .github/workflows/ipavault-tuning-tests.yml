name: IPA Vault Tuning Tests

on:
  push:
    paths:
      - 'Ksign/Views/Downloader/ViewModels/IPADownloadManager.swift'
      - 'Tests/IPAVaultTuning/**'
      - '.github/workflows/ipavault-tuning-tests.yml'
  pull_request:
    paths:
      - 'Ksign/Views/Downloader/ViewModels/IPADownloadManager.swift'
      - 'Tests/IPAVaultTuning/**'
      - '.github/workflows/ipavault-tuning-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tuning:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test production adaptive controller
        run: bash Tests/IPAVaultTuning/run.sh
